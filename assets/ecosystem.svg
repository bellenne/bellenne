<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bellenne Ecosystem</title>
  <desc id="desc">A dark premium ecosystem diagram showing Bellenne in the center with six products around it: Pulse, Echo, Vector, Nest, Proof and Relay.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B12"></stop>
      <stop offset="1" stop-color="#0B1020"></stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"></stop>
      <stop offset="100%" stop-color="#EC4899"></stop>
    </linearGradient>

    <linearGradient id="lineGrad" x1="280" y1="160" x2="920" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.45"></stop>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0.45"></stop>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"></feGaussianBlur>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.6588
                0 1 0 0 0.3333
                0 0 1 0 0.9686
                0 0 0 0.30 0"></feColorMatrix>
      <feBlend in="SourceGraphic" mode="screen"></feBlend>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"></feDropShadow>
    </filter>

    <style>
      .title { font: 700 30px Inter, Segoe UI, Arial, sans-serif; fill: #F8FAFC; letter-spacing: 0.5px; }
      .subtitle { font: 500 14px Inter, Segoe UI, Arial, sans-serif; fill: #94A3B8; }
      .centerTitle { font: 800 28px Inter, Segoe UI, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 2px; }
      .centerSub { font: 500 14px Inter, Segoe UI, Arial, sans-serif; fill: #CBD5E1; }
      .cardNum { font: 700 12px Inter, Segoe UI, Arial, sans-serif; fill: #E2E8F0; }
      .cardTitle { font: 700 22px Inter, Segoe UI, Arial, sans-serif; fill: #F8FAFC; letter-spacing: 0.8px; }
      .cardSub { font: 600 13px Inter, Segoe UI, Arial, sans-serif; fill: #C084FC; letter-spacing: 0.4px; }
      .cardDesc { font: 500 13px Inter, Segoe UI, Arial, sans-serif; fill: #94A3B8; }
      .footer { font: 600 13px Inter, Segoe UI, Arial, sans-serif; fill: #64748B; letter-spacing: 1.2px; }
      .label { font: 700 12px JetBrains Mono, Consolas, monospace; fill: #E5E7EB; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="520" rx="28" fill="url(#bg)"></rect>

  <!-- subtle top line -->
  <line x1="56" y1="84" x2="1144" y2="84" stroke="#334155" stroke-width="1"></line>

  <!-- Header -->
  <rect x="56" y="42" width="162" height="32" rx="10" fill="#1F2937"></rect>
  <text x="76" y="63" class="label">// ecosystem</text>

  <text x="1144" y="63" text-anchor="end" class="subtitle">six tools. one ecosystem.</text>

  <!-- Decorative glow -->
  <ellipse cx="600" cy="258" rx="235" ry="100" fill="#A855F7" fill-opacity="0.07" filter="url(#softGlow)"></ellipse>

  <!-- Connection lines -->
  <g stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round">
    <path d="M370 170 C440 190, 490 210, 530 228"></path>
    <path d="M600 170 C600 192, 600 210, 600 228"></path>
    <path d="M830 170 C760 190, 710 210, 670 228"></path>

    <path d="M370 350 C440 330, 490 308, 530 292"></path>
    <path d="M600 350 C600 328, 600 310, 600 292"></path>
    <path d="M830 350 C760 330, 710 308, 670 292"></path>
  </g>

  <!-- Center -->
  <g filter="url(#cardShadow)">
    <rect x="470" y="210" width="260" height="100" rx="22" fill="#0F172A" stroke="url(#accent)" stroke-width="1.5"></rect>
    <rect x="486" y="226" width="228" height="68" rx="16" fill="#111827"></rect>
    <text x="600" y="258" text-anchor="middle" class="centerTitle">BELLENNE</text>
    <text x="600" y="282" text-anchor="middle" class="centerSub">software • automation • systems</text>
  </g>

  <!-- Top Left Card: Pulse -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="110" width="280" height="96" rx="18" fill="#0B1220" stroke="#243041"></rect>
    <rect x="108" y="126" width="34" height="22" rx="8" fill="#1F2937"></rect>
    <text x="125" y="141" text-anchor="middle" class="cardNum">01</text>
    <text x="156" y="144" class="cardTitle">PULSE</text>
    <text x="108" y="168" class="cardSub">Analytics &amp; reporting</text>
    <text x="108" y="188" class="cardDesc">Operational data → clear decisions</text>
  </g>

  <!-- Top Center Card: Echo -->
  <g filter="url(#cardShadow)">
    <rect x="460" y="90" width="280" height="96" rx="18" fill="#0B1220" stroke="#243041"></rect>
    <rect x="478" y="106" width="34" height="22" rx="8" fill="#1F2937"></rect>
    <text x="495" y="121" text-anchor="middle" class="cardNum">02</text>
    <text x="526" y="124" class="cardTitle">ECHO</text>
    <text x="478" y="148" class="cardSub">Automated communication</text>
    <text x="478" y="168" class="cardDesc">Feedback → automatic responses</text>
  </g>

  <!-- Top Right Card: Vector -->
  <g filter="url(#cardShadow)">
    <rect x="830" y="110" width="280" height="96" rx="18" fill="#0B1220" stroke="#243041"></rect>
    <rect x="848" y="126" width="34" height="22" rx="8" fill="#1F2937"></rect>
    <text x="865" y="141" text-anchor="middle" class="cardNum">03</text>
    <text x="896" y="144" class="cardTitle">VECTOR</text>
    <text x="848" y="168" class="cardSub">Data processing</text>
    <text x="848" y="188" class="cardDesc">Raw sources → structured data</text>
  </g>

  <!-- Bottom Left Card: Nest -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="314" width="280" height="96" rx="18" fill="#0B1220" stroke="#243041"></rect>
    <rect x="108" y="330" width="34" height="22" rx="8" fill="#1F2937"></rect>
    <text x="125" y="345" text-anchor="middle" class="cardNum">04</text>
    <text x="156" y="348" class="cardTitle">NEST</text>
    <text x="108" y="372" class="cardSub">Wallpaper layout engine</text>
    <text x="108" y="392" class="cardDesc">Artwork → production layouts</text>
  </g>

  <!-- Bottom Center Card: Proof -->
  <g filter="url(#cardShadow)">
    <rect x="460" y="334" width="280" height="96" rx="18" fill="#0B1220" stroke="#243041"></rect>
    <rect x="478" y="350" width="34" height="22" rx="8" fill="#1F2937"></rect>
    <text x="495" y="365" text-anchor="middle" class="cardNum">05</text>
    <text x="526" y="368" class="cardTitle">PROOF</text>
    <text x="478" y="392" class="cardSub">Automated color proof workflow</text>
    <text x="478" y="412" class="cardDesc">Request → ready color proof</text>
  </g>

  <!-- Bottom Right Card: Relay -->
  <g filter="url(#cardShadow)">
    <rect x="830" y="314" width="280" height="96" rx="18" fill="#0B1220" stroke="#243041"></rect>
    <rect x="848" y="330" width="34" height="22" rx="8" fill="#1F2937"></rect>
    <text x="865" y="345" text-anchor="middle" class="cardNum">06</text>
    <text x="896" y="348" class="cardTitle">RELAY</text>
    <text x="848" y="372" class="cardSub">Real-time translation</text>
    <text x="848" y="392" class="cardDesc">Speech → live translation</text>
  </g>

  <!-- Footer -->
  <line x1="56" y1="458" x2="1144" y2="458" stroke="#1E293B" stroke-width="1"></line>
  <text x="600" y="486" text-anchor="middle" class="footer">BELLENNE ECOSYSTEM</text>
</svg>